# Floci with Docker access, so ECS tasks run as real containers on the pbl-ecs-spike network. See spike.sh.
#
#   4566   AWS APIs and the ECR registry (the task images are pulled from localhost:4566 by the host's daemon)
#   18081  the ALB's HTTP listener (port 80 inside Floci)
#   18443  the ALB's HTTPS listener (port 443 inside Floci)

services:
  floci: # the image has no curl, wget or grep, hence bash alone
    image: floci/floci:2.4.0
    user: root # to use the Docker socket and bind the listeners' ports 80 and 443
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: ap-southeast-1
      FLOCI_SERVICES_ECS_DOCKER_NETWORK: pbl-ecs-spike
      FLOCI_SERVICES_ECR_URI_STYLE: path # Docker 29's containerd image store treats *.localhost as an HTTPS registry
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    ports: ["4566:4566", "18081:80", "18443:443"]
    networks: [spike]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4566 && printf 'GET /_localstack/health HTTP/1.0\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 3s
      retries: 30

networks:
  spike: { name: pbl-ecs-spike }
