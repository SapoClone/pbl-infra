# Floci for web.sh, on its own port so it runs beside the rehearsal (14566) and the ECS spike (4566).

services:
  floci: # the image has no curl, wget or grep, hence bash alone
    image: floci/floci:2.4.0
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: ap-southeast-1
      FLOCI_SERVICES_S3_ENFORCE_AUTH: "true" # so an anonymous read of the bucket is refused, as on AWS
    ports: ["24566:4566"]
    networks: [web]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4566 && printf 'GET /_localstack/health HTTP/1.0\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 3s
      retries: 30

networks:
  web: { name: pbl-web-rehearsal }
