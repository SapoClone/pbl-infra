    <style>
      body {

        height: 64px;
        display: flex;
        align-items: center;
        padding: 0 24px;
        border-bottom: 1px solid #26304a;
        font-weight: 700;
      }
      .app {

      }
      aside {
        padding: 16px;
        border-right: 1px solid #26304a;
        overflow: auto;
      }
      button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 11px 12px;
        margin: 4px 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #b9c3d8;
        cursor: pointer;
      }
      button.active,
      button:hover {
        background: #1b2640;
        color: #fff;
      }
      .main {
        padding: 22px;
        overflow: auto;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .open {
        background: #2f6fed;
        color: white;
        text-decoration: none;
        padding: 10px 14px;
        border-radius: 8px;
      }
      .code {
        margin-top: 16px;
        background: #070b15;
        border: 1px solid #26304a;
        border-radius: 10px;
        padding: 16px;
        white-space: pre;
        overflow: auto;
        font:
          12px/1.45 ui-monospace,
          SFMono-Regular,
          monospace;
        max-height: calc(100vh - 180px);
      }
      small {
        color: #8e9ab3;
      }
    </style>

          code: "erDiagram\n\n    DailySalesSummary {\n\n        uuid id PK\n\n        uuid tenant_id FK\n\n        uuid branch_id \"id trần → platform.Branch\"\n\n        uuid channel_id \"id trần → sales.SalesChannel\"\n\n        date summary_date\n\n        int order_count\n\n        decimal total_revenue\n\n        decimal total_discount\n\n        decimal total_cost\n\n        decimal gross_profit\n\n        datetime updated_at\n\n    }\n\n    ProductSalesSummary {\n\n        uuid id PK\n\n        uuid tenant_id FK\n\n        uuid branch_id \"id trần\"\n\n        uuid variant_id \"id trần → catalog.ProductVariant\"\n\n        date summary_date\n\n        decimal quantity_sold\n\n        decimal total_revenue\n\n        decimal total_cost\n\n    }\n\n    InventoryValueSnapshot {\n\n        uuid id PK\n\n        uuid tenant_id FK\n\n        uuid branch_id \"id trần\"\n\n        date snapshot_date\n\n        int total_quantity\n\n        decimal total_value\n\n    }\n\n    Notification {\n\n        uuid id PK\n\n        uuid tenant_id FK\n\n        string type\n\n        string title\n\n        string body\n\n        string ref_type \"nullable\"\n\n        uuid ref_id \"nullable\"\n\n        uuid branch_id \"id trần, nullable\"\n\n        datetime created_at\n\n    }\n\n    NotificationRecipient {\n\n        uuid id PK\n\n        uuid tenant_id FK\n\n        uuid notification_id FK\n\n        uuid staff_id \"id trần → platform.Staff\"\n\n        bool is_read\n\n        datetime read_at\n\n    }\n\n    DeviceToken {\n\n        uuid id PK\n\n        uuid tenant_id FK\n\n        uuid staff_id \"id trần\"\n\n        string fcm_token UK\n\n        string platform\n\n        bool is_active\n\n        datetime last_used_at\n\n        datetime created_at\n\n    }\n\n    EmailTemplate {\n\n        uuid id PK\n\n        uuid tenant_id FK \"nullable\"\n\n        string code UK\n\n        string subject\n\n        string body_html\n\n        bool is_active\n\n    }\n\n    EmailLog {\n\n        uuid id PK\n\n        uuid tenant_id FK\n\n        string template_code\n\n        string to_email\n\n        string status\n\n        string provider_message_id\n\n        string error_message\n\n        int attempt_count\n\n        datetime created_at\n\n        datetime sent_at\n\n        string error_code \"FIGMA: E_MAIL_TIMEOUT\"\n    }\n\n    BuiltDailySales {\n        uuid tenant_id PK \"BUILT: bảng daily_sales, PK (tenant_id, branch_id, sales_date)\"\n        uuid branch_id PK\n        date sales_date PK\n        int order_count\n        bigint revenue \"dựng từ sales.order.completed, idempotent qua inbox\"\n    }\n\n    AuditLog {\n\n        uuid id PK\n\n        uuid tenant_id \"FIGMA: nullable: null = phạm vi nền tảng\"\n\n        string actor_type\n\n        uuid actor_id \"id trần, nullable\"\n\n        string service_name\n\n        string action\n\n        string entity_type\n\n        uuid entity_id\n\n        jsonb before_data\n\n        jsonb after_data\n\n        string trace_id\n\n        datetime created_at\n\n        string actor_label \"FIGMA: Lan Anh · Quản trị viên / Hệ thống\"\n        string result \"FIGMA: success | failure; chỉ đọc, giữ ≥ 12 tháng\"\n    }\n\n    Notification ||--o{ NotificationRecipient : \"sent to\"\n\n    HourlySalesSummary {\n        uuid id PK\n        uuid tenant_id\n        uuid branch_id\n        uuid channel_id\n        date summary_date\n        int hour \"FIGMA: Doanh thu theo giờ (web + app)\"\n        int order_count\n        decimal total_revenue\n    }\n    PlatformAnnouncement {\n        uuid id PK\n        string title\n        string type \"FIGMA: maintenance | update | guide\"\n        string body\n        string audience_type \"all | plan | integration_provider | tenants\"\n        jsonb audience_filter \"vd plan=pro, provider=shopee\"\n        string status \"draft | scheduled | sent\"\n        datetime scheduled_at\n        datetime sent_at\n        uuid created_by \"platform_admin\"\n        datetime created_at\n    }\n    AnnouncementRecipient {\n        uuid announcement_id PK, FK\n        uuid tenant_id PK\n        datetime read_at\n    }\n    PlatformAnnouncement ||--o{ AnnouncementRecipient : \"\"",
